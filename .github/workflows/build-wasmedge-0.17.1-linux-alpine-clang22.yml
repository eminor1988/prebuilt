name: Build WasmEdge 0.17.1 Linux Alpine Clang 22.1.3 (musl)

on:
  workflow_dispatch:
    inputs:
      llvm_release_tag:
        description: "LLVM prebuilt release tag"
        required: true
        type: string
  workflow_call:
    inputs:
      llvm_release_tag:
        description: "LLVM prebuilt release tag"
        required: true
        type: string
    outputs:
      release_tag:
        description: "Release tag for the built artifacts"
        value: ${{ jobs.build.outputs.release_tag }}

permissions:
  contents: write

env:
  WasmEdge_VERSION: "0.17.1"
  TARGET_TRIPLE: x86_64-linux-linux
  COMPILER: clang
  COMPILER_VERSION: "22.1.3"
  STDLIB: libcxx
  LLD: lld

jobs:
  build:
    name: Build WasmEdge 0.17.1 (Linux x86_64 Alpine Clang 22.1.3 musl)
    runs-on: ubuntu-latest
    container: alpine:3.24
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base cmake ninja python3 git wget linux-headers \
            clang22 lld22 libc++-dev libc++ zstd-dev zlib-dev

      - name: Download prebuilt LLVM
        run: |
          mkdir -p /deps/llvm
          wget -q "https://github.com/${{ github.repository_owner }}/prebuilt/releases/download/${{ inputs.llvm_release_tag }}/${{ inputs.llvm_release_tag }}.tar.gz" \
            -O /tmp/llvm.tar.gz
          tar -xzf /tmp/llvm.tar.gz -C /deps/llvm
          rm /tmp/llvm.tar.gz

      - name: Compute release tag
        id: meta
        run: |
          TAG="wasmedge-${{ env.WasmEdge_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}"
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build WasmEdge
        run: |
          git clone --depth 1 --branch ${{ env.WasmEdge_VERSION }} https://github.com/WasmEdge/WasmEdge.git /tmp/wasmedge
          LLVM_DIR=$(find /deps/llvm -name "LLVMConfig.cmake" -exec dirname {} \; | head -1)
          echo "LLVM_DIR=$LLVM_DIR"
          cmake -S /tmp/wasmedge -B /tmp/wasmedge/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/wasmedge-install \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_PREFIX_PATH=/deps/llvm \
            -DLLVM_DIR="$LLVM_DIR" \
            -DWASMEDGE_BUILD_STATIC_LIB=ON \
            -DWASMEDGE_BUILD_SHARED_LIB=OFF \
            -DWASMEDGE_LINK_LLVM_STATIC=ON \
            -DWASMEDGE_BUILD_TOOLS=OFF \
            -DWASMEDGE_BUILD_TESTS=OFF
          cmake --build /tmp/wasmedge/build
          cmake --install /tmp/wasmedge/build
          rm -rf /tmp/wasmedge

      - name: Package
        run: |
          cd /tmp/wasmedge-install
          tar -czf /tmp/wasmedge-${{ env.WasmEdge_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasmedge-linux-alpine
          path: /tmp/wasmedge-*.tar.gz

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: wasmedge-linux-alpine

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: "WasmEdge ${{ env.WasmEdge_VERSION }} (${{ env.TARGET_TRIPLE }}, ${{ env.COMPILER }} ${{ env.COMPILER_VERSION }}, musl)"
          files: wasmedge-*.tar.gz
          draft: false
          prerelease: false
