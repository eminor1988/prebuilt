name: Build LLVM 23.1.0 Linux Clang 23.1.0 (musl)

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      release_tag:
        description: "Release tag for the built artifacts"
        value: ${{ jobs.build.outputs.release_tag }}

permissions:
  contents: write

env:
  LLVM_VERSION: "23.1.0"
  TARGET_TRIPLE: x86_64-linux-linux
  COMPILER: clang
  COMPILER_VERSION: "23.1.0"
  STDLIB: libcxx
  LLD: lld

jobs:
  build:
    name: Build LLVM 23.1.0 (Linux x86_64 Clang 23.1.0 musl)
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 git wget lsb-release gnupg software-properties-common
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23 all || true
          sudo apt-get install -y clang-23 lld-23
          clang++-23 --version

      - name: Build musl 1.2.5 from source
        run: |
          wget https://musl.libc.org/releases/musl-1.2.5.tar.gz
          tar xzf musl-1.2.5.tar.gz
          cd musl-1.2.5
          ./configure --prefix=/usr/local/musl
          make -j$(nproc)
          sudo make install

      - name: Get libatomic for musl
        run: |
          wget -q https://musl.cc/x86_64-linux-musl-cross.tgz
          tar xzf x86_64-linux-musl-cross.tgz
          sudo cp x86_64-linux-musl-cross/x86_64-linux-musl/lib/libatomic.a /usr/local/musl/lib/
          rm -rf x86_64-linux-musl-cross x86_64-linux-musl-cross.tgz

      - name: Compute release tag
        id: meta
        run: |
          TAG="llvm-${{ env.LLVM_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}"
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout LLVM source
        run: |
          git clone --depth 1 --branch llvmorg-${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project.git

      - name: Build zstd (static, musl)
        run: |
          git clone --depth 1 --branch v1.5.7 https://github.com/facebook/zstd.git
          cmake -S zstd/build/cmake -B zstd-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install \
            -DCMAKE_C_COMPILER=clang-23 \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DCMAKE_C_FLAGS="--target=x86_64-linux-musl -isystem /usr/local/musl/include" \
            -DCMAKE_CXX_FLAGS="--target=x86_64-linux-musl -isystem /usr/local/musl/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L/usr/local/musl/lib" \
            -DZSTD_BUILD_STATIC=ON \
            -DZSTD_BUILD_SHARED=OFF \
            -DZSTD_BUILD_PROGRAMS=OFF \
            -DZSTD_BUILD_TESTS=OFF
          cmake --build zstd-build
          cmake --install zstd-build

      - name: Build LLVM + LLD with libc++ (musl)
        run: |
          cmake -S llvm-project/llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install \
            -DCMAKE_C_COMPILER=clang-23 \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DCMAKE_C_FLAGS="--target=x86_64-linux-musl -isystem /usr/local/musl/include" \
            -DCMAKE_CXX_FLAGS="--target=x86_64-linux-musl -isystem /usr/local/musl/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L/usr/local/musl/lib -latomic -fuse-ld=lld" \
            -DCMAKE_AR=llvm-ar-23 \
            -DCMAKE_RANLIB=llvm-ranlib-23 \
            -DCMAKE_REQUIRED_FLAGS="--target=x86_64-linux-musl -isystem /usr/local/musl/include" \
            -DCMAKE_REQUIRED_LINK_OPTIONS="-L/usr/local/musl/lib" \
            -DLLVM_ENABLE_PROJECTS="lld" \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_LIBCXX=ON \
            -DLLVM_ENABLE_LLD=ON
          cmake --build build

      - name: Install
        run: |
          cmake --install build
          tar -czf llvm-${{ env.LLVM_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}.tar.gz -C install .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-linux
          path: llvm-*.tar.gz

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: llvm-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: "LLVM ${{ env.LLVM_VERSION }} (${{ env.TARGET_TRIPLE }}, ${{ env.COMPILER }} ${{ env.COMPILER_VERSION }}, musl)"
          files: llvm-*.tar.gz
          draft: false
          prerelease: false
