name: Build libuv 1.49.2 Linux Alpine Clang 22.1.3 (musl)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LIBUV_VERSION: "v1.49.2"
  TARGET_TRIPLE: x86_64-linux-linux
  COMPILER: clang
  COMPILER_VERSION: "22.1.3"
  STDLIB: static
  LLD: lld

jobs:
  build:
    name: Build libuv 1.49.2 (Linux x86_64 Alpine Clang 22.1.3 musl)
    runs-on: ubuntu-latest
    container: alpine:3.24
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout prebuilt repo
        uses: actions/checkout@v4
        with:
          path: prebuilt

      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base cmake ninja python3 git wget \
            clang22 lld22

      - name: Clone libuv
        run: |
          git clone --depth 1 --branch ${{ env.LIBUV_VERSION }} \
            https://github.com/libuv/libuv.git /tmp/libuv

      - name: Apply patches
        run: |
          python3 prebuilt/scripts/build-libuv-1.49.2-linux-alpine-clang22.py /tmp/libuv

      - name: Compute release tag
        id: meta
        run: |
          TAG="libuv-${{ env.LIBUV_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}"
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build libuv
        run: |
          cmake -S /tmp/libuv -B /tmp/libuv/build -G Ninja \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/libuv-install \
            -DLIBUV_BUILD_SHARED=OFF \
            -DBUILD_TESTING=OFF
          cmake --build /tmp/libuv/build
          cmake --install /tmp/libuv/build
          rm -rf /tmp/libuv

      - name: Package
        run: |
          cd /tmp/libuv-install
          tar -czf /tmp/libuv-${{ env.LIBUV_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libuv-linux-alpine
          path: /tmp/libuv-*.tar.gz

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: libuv-linux-alpine

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: "libuv ${{ env.LIBUV_VERSION }} (${{ env.TARGET_TRIPLE }}, ${{ env.COMPILER }} ${{ env.COMPILER_VERSION }}, musl)"
          files: libuv-*.tar.gz
          draft: false
          prerelease: false
