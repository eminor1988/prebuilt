name: Build WasmEdge 0.17.1 Windows MSVC 19.44

on:
  workflow_dispatch:
    inputs:
      llvm_release_tag:
        description: "LLVM prebuilt release tag"
        required: true
        type: string
  workflow_call:
    inputs:
      llvm_release_tag:
        description: "LLVM prebuilt release tag (e.g., llvm-23.1.0-x86_64-pc-windows-msvc-19.44-mt-lld)"
        required: true
        type: string
    outputs:
      release_tag:
        description: "Release tag for the built artifacts"
        value: ${{ jobs.build.outputs.release_tag }}

permissions:
  contents: write

env:
  WasmEdge_VERSION: "0.17.1"
  TARGET_TRIPLE: x86_64-pc-windows
  COMPILER: msvc
  COMPILER_VERSION: "19.44"
  STDLIB: mt
  LLD: lld

jobs:
  build:
    name: Build WasmEdge 0.17.1 (Windows x86_64 MSVC 19.44 /MT)
    runs-on: windows-2025
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@v1.1

      - name: Download prebuilt LLVM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.llvm_release_tag }}" `
            --repo ${{ github.repository_owner }}/prebuilt `
            --pattern '*.zip' `
            --dir deps
          Expand-Archive -Path deps\llvm-*.zip -DestinationPath deps\llvm

      - name: Compute release tag
        id: meta
        shell: pwsh
        run: |
          $tag = "wasmedge-${{ env.WasmEdge_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}"
          echo "release_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout WasmEdge
        run: |
          git clone --depth 1 --branch ${{ env.WasmEdge_VERSION }} https://github.com/WasmEdge/WasmEdge.git

      - name: Patch WasmEdge cmake for Windows
        shell: pwsh
        run: |
          # Fix 1: lib/api/CMakeLists.txt - sanitize :: in directory names
          $file = "WasmEdge\lib\api\CMakeLists.txt"
          $content = Get-Content $file -Raw
          $old = 'function(wasmedge_add_static_lib_component_command target)'
          $new = 'function(wasmedge_add_static_lib_component_command target)' + "`n" + '  string(REGEX REPLACE ":" "_" safe_target "${target}")'
          $content = $content.Replace($old, $new)
          $content = $content.Replace('objs/${target}', 'objs/${safe_target}')
          Set-Content $file $content -NoNewline
          Write-Host "Patched $file"

          # Fix 2: cmake/Helper.cmake - comprehensive MSVC static lib fixes
          $file2 = "WasmEdge\cmake\Helper.cmake"
          $h = Get-Content $file2 -Raw
          # Replace hardcoded .a filenames with .lib
          $h = $h.Replace('liblldELF.a', 'lldELF.lib')
          $h = $h.Replace('liblldCommon.a', 'lldCommon.lib')
          $h = $h.Replace('liblldCore.a', 'lldCore.lib')
          $h = $h.Replace('liblldDriver.a', 'lldDriver.lib')
          $h = $h.Replace('liblldReaderWriter.a', 'lldReaderWriter.lib')
          $h = $h.Replace('liblldYAML.a', 'lldYAML.lib')
          $h = $h.Replace('liblldMinGW.a', 'lldMinGW.lib')
          $h = $h.Replace('liblldCOFF.a', 'lldCOFF.lib')
          $h = $h.Replace('liblldMachO.a', 'lldMachO.lib')
          $h = $h.Replace('liblldWasm.a', 'lldWasm.lib')
          # On MSVC, use find_package(zstd) found path instead of hardcoded libzstd.a
          $h = $h.Replace(
            '${ZSTD_PATH}/libzstd.a',
            '${zstd_LIBRARY}')
          # Fix llvm-config output: on MSVC --libs --link-static returns full paths
          # Use --libnames which returns just filenames, then prepend LLVM_LIBRARY_DIR
          $h = $h.Replace(
            'llvm-config --libs --link-static',
            'llvm-config --libnames')
          # --libnames returns filenames like "LLVMCore.lib" (MSVC) or "libLLVMCore.a" (Unix)
          # So just prepend directory without adding prefix/suffix
          $h = $h.Replace(
            '${LLVM_LIBRARY_DIR}/lib${LIB_NAME}.a',
            '${LLVM_LIBRARY_DIR}/${LIB_NAME}')
          Set-Content $file2 $h -NoNewline
          Write-Host "Patched $file2"

      - name: Build WasmEdge
        run: |
          $llvmDir = (Get-Item "deps\llvm\lib\cmake\llvm").FullName
          $lldDir = (Get-Item "deps\llvm\lib\cmake\lld").FullName
          $prefix = (Get-Item "deps\llvm").FullName
          Write-Host "LLVM_DIR=$llvmDir"
          Write-Host "LLD_DIR=$lldDir"
          Write-Host "PREFIX=$prefix"
          cmake -S WasmEdge -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=install `
            -DCMAKE_PREFIX_PATH="$prefix" `
            -DLLVM_DIR="$llvmDir" `
            -DLLD_DIR="$lldDir" `
            -DWASMEDGE_BUILD_STATIC_LIB=ON `
            -DWASMEDGE_BUILD_SHARED_LIB=OFF `
            -DWASMEDGE_LINK_LLVM_STATIC=ON `
            -DWASMEDGE_BUILD_TOOLS=OFF `
            -DWASMEDGE_BUILD_TESTS=OFF
          cmake --build build

      - name: Install
        run: |
          cmake --install build
          Compress-Archive -Path install\* -DestinationPath wasmedge-${{ env.WasmEdge_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasmedge-windows
          path: wasmedge-*.zip

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: wasmedge-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: "WasmEdge ${{ env.WasmEdge_VERSION }} (${{ env.TARGET_TRIPLE }}, ${{ env.COMPILER }} ${{ env.COMPILER_VERSION }}, ${{ env.STDLIB }})"
          files: wasmedge-*.zip
          draft: false
          prerelease: false
