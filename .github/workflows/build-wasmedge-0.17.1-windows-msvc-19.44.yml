name: Build WasmEdge 0.17.1 Windows MSVC 19.44

on:
  workflow_dispatch:
    inputs:
      llvm_release_tag:
        description: "LLVM prebuilt release tag"
        required: true
        type: string
  workflow_call:
    inputs:
      llvm_release_tag:
        description: "LLVM prebuilt release tag (e.g., llvm-23.1.0-x86_64-pc-windows-msvc-19.44-mt-lld)"
        required: true
        type: string
    outputs:
      release_tag:
        description: "Release tag for the built artifacts"
        value: ${{ jobs.build.outputs.release_tag }}

permissions:
  contents: write

env:
  WasmEdge_VERSION: "0.17.1"
  TARGET_TRIPLE: x86_64-pc-windows
  COMPILER: msvc
  COMPILER_VERSION: "19.44"
  STDLIB: mt
  LLD: lld

jobs:
  build:
    name: Build WasmEdge 0.17.1 (Windows x86_64 MSVC 19.44 /MT)
    runs-on: windows-2025
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@v1.1

      - name: Download prebuilt LLVM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.llvm_release_tag }}" `
            --repo ${{ github.repository_owner }}/prebuilt `
            --pattern '*.zip' `
            --dir deps
          Expand-Archive -Path deps\llvm-*.zip -DestinationPath deps\llvm

      - name: Compute release tag
        id: meta
        shell: pwsh
        run: |
          $tag = "wasmedge-${{ env.WasmEdge_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}"
          echo "release_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout WasmEdge
        run: |
          git clone --depth 1 --branch ${{ env.WasmEdge_VERSION }} https://github.com/WasmEdge/WasmEdge.git

      - name: Patch WasmEdge cmake for Windows (fix :: in directory names)
        shell: pwsh
        run: |
          # WasmEdge bug: uses target names like fmt::fmt as directory names.
          # Windows disallows ':' in paths. Sanitize by replacing :: with _.
          $file = "WasmEdge\lib\api\CMakeLists.txt"
          $content = Get-Content $file -Raw
          # Add sanitization at the top of the function
          $content = $content -replace '(function\(wasmedge_add_static_lib_component_command target\))',
            "`$1`n  string(REGEX REPLACE :: _ safe_target `${target})"
          # Replace objs/${target} with objs/${safe_target} in the function body
          $content = $content -replace 'objs/\$\{target\}', 'objs/${safe_target}'
          Set-Content $file $content -NoNewline
          Write-Host "Patched $file"

      - name: Build WasmEdge
        run: |
          $llvmDir = (Get-Item "deps\llvm\lib\cmake\llvm").FullName
          $lldDir = (Get-Item "deps\llvm\lib\cmake\lld").FullName
          $prefix = (Get-Item "deps\llvm").FullName
          Write-Host "LLVM_DIR=$llvmDir"
          Write-Host "LLD_DIR=$lldDir"
          Write-Host "PREFIX=$prefix"
          cmake -S WasmEdge -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=install `
            -DCMAKE_PREFIX_PATH="$prefix" `
            -DLLVM_DIR="$llvmDir" `
            -DLLD_DIR="$lldDir" `
            -DWASMEDGE_BUILD_STATIC_LIB=ON `
            -DWASMEDGE_BUILD_SHARED_LIB=OFF `
            -DWASMEDGE_LINK_LLVM_STATIC=ON `
            -DWASMEDGE_BUILD_TOOLS=OFF `
            -DWASMEDGE_BUILD_TESTS=OFF
          cmake --build build

      - name: Install
        run: |
          cmake --install build
          Compress-Archive -Path install\* -DestinationPath wasmedge-${{ env.WasmEdge_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasmedge-windows
          path: wasmedge-*.zip

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: wasmedge-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: "WasmEdge ${{ env.WasmEdge_VERSION }} (${{ env.TARGET_TRIPLE }}, ${{ env.COMPILER }} ${{ env.COMPILER_VERSION }}, ${{ env.STDLIB }})"
          files: wasmedge-*.zip
          draft: false
          prerelease: false
