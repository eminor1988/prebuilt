name: Build Vulkan-Loader 1.4.362 Linux Alpine Clang 22.1.3 (musl)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  VULKAN_HEADERS_VERSION: "v1.4.362"
  VULKAN_LOADER_VERSION: "v1.4.362"
  TARGET_TRIPLE: x86_64-linux-linux
  COMPILER: clang
  COMPILER_VERSION: "22.1.3"
  STDLIB: static
  LLD: lld

jobs:
  build:
    name: Build Vulkan-Loader 1.4.362 (Linux x86_64 Alpine Clang 22.1.3 musl)
    runs-on: ubuntu-latest
    container: alpine:3.24
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout prebuilt repo
        uses: actions/checkout@v4
        with:
          path: prebuilt

      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base cmake ninja python3 git wget \
            clang22 lld22

      - name: Clone Vulkan-Headers
        run: |
          git clone --depth 1 --branch ${{ env.VULKAN_HEADERS_VERSION }} \
            https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers

      - name: Install Vulkan-Headers
        run: |
          cmake -S /tmp/vulkan-headers -B /tmp/vulkan-headers/build -G Ninja \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_INSTALL_PREFIX=/tmp/vulkan-install
          cmake --build /tmp/vulkan-headers/build
          cmake --install /tmp/vulkan-headers/build
          rm -rf /tmp/vulkan-headers

      - name: Clone Vulkan-Loader
        run: |
          git clone --depth 1 --branch ${{ env.VULKAN_LOADER_VERSION }} \
            https://github.com/KhronosGroup/Vulkan-Loader.git /tmp/vulkan-loader

      - name: Apply patches
        run: |
          python3 prebuilt/scripts/linux-alpine-clang22/vulkan-loader-1.4.362.script.py /tmp/vulkan-loader

      - name: Compute release tag
        id: meta
        run: |
          TAG="vulkan-loader-${{ env.VULKAN_LOADER_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}"
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Vulkan-Loader
        run: |
          cmake -S /tmp/vulkan-loader -B /tmp/vulkan-loader/build -G Ninja \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/vulkan-loader-install \
            -DCMAKE_PREFIX_PATH=/tmp/vulkan-install \
            -DBUILD_STATIC_LOADER=ON \
            -DBUILD_TESTS=OFF
          cmake --build /tmp/vulkan-loader/build
          mkdir -p /tmp/vulkan-loader-install/lib
          cp /tmp/vulkan-loader/build/loader/libvulkan.a /tmp/vulkan-loader-install/lib/
          rm -rf /tmp/vulkan-loader

      - name: Package
        run: |
          cd /tmp/vulkan-loader-install
          tar -czf /tmp/vulkan-loader-${{ env.VULKAN_LOADER_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-loader-linux-alpine
          path: /tmp/vulkan-loader-*.tar.gz

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vulkan-loader-linux-alpine

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: "Vulkan-Loader ${{ env.VULKAN_LOADER_VERSION }} (${{ env.TARGET_TRIPLE }}, ${{ env.COMPILER }} ${{ env.COMPILER_VERSION }}, musl)"
          files: vulkan-loader-*.tar.gz
          draft: false
          prerelease: false
