name: Build LLVM 23.1.0 Windows MinGW llvm-mingw 23.1.0

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      release_tag:
        description: "Release tag for the built artifacts"
        value: ${{ jobs.build.outputs.release_tag }}

permissions:
  contents: write

env:
  LLVM_VERSION: "23.1.0"
  ZSTD_VERSION: v1.5.7
  TARGET_TRIPLE: x86_64-w64-windows-gnu
  COMPILER: mingw
  COMPILER_VERSION: "23.1.0"
  STDLIB: libcxx
  LLD: lld

jobs:
  build:
    name: Build LLVM 23.1.0 (Windows x86_64 MinGW llvm-mingw 23.1.0)
    runs-on: ubuntu-latest
    container: mstorsjo/llvm-mingw:20260826
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            cmake ninja-build python3 git wget ca-certificates

      - name: Compute release tag
        id: meta
        run: |
          TAG="llvm-${{ env.LLVM_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}"
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: MinGW toolchain file
        run: |
          cat > /tmp/mingw-toolchain.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)
          set(CMAKE_C_COMPILER x86_64-w64-mingw32-clang)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-clang++)
          set(CMAKE_AR x86_64-w64-mingw32-llvm-ar)
          set(CMAKE_RANLIB x86_64-w64-mingw32-llvm-ranlib)
          set(CMAKE_NM x86_64-w64-mingw32-llvm-nm)
          set(CMAKE_STRIP x86_64-w64-mingw32-llvm-strip)
          set(CMAKE_SYSROOT /opt/llvm-mingw/x86_64-w64-mingw32)
          set(CMAKE_FIND_ROOT_PATH /opt/llvm-mingw/x86_64-w64-mingw32)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-fuse-ld=lld")
          EOF

      - name: Build zstd (native Linux for host tools)
        run: |
          git clone --depth 1 --branch ${ZSTD_VERSION} https://github.com/facebook/zstd.git /tmp/zstd
          cmake -S /tmp/zstd/build/cmake -B /tmp/zstd/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/zstd-install \
            -DZSTD_BUILD_STATIC=ON \
            -DZSTD_BUILD_SHARED=OFF \
            -DZSTD_BUILD_PROGRAMS=OFF \
            -DZSTD_BUILD_TESTS=OFF
          cmake --build /tmp/zstd/build
          cmake --install /tmp/zstd/build
          rm -rf /tmp/zstd

      - name: Build zstd (Windows cross-compile)
        run: |
          git clone --depth 1 --branch ${ZSTD_VERSION} https://github.com/facebook/zstd.git /tmp/zstd-win
          cmake -S /tmp/zstd-win/build/cmake -B /tmp/zstd-win/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/mingw-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/zstd-win-install \
            -DZSTD_BUILD_STATIC=ON \
            -DZSTD_BUILD_SHARED=OFF \
            -DZSTD_BUILD_PROGRAMS=OFF \
            -DZSTD_BUILD_TESTS=OFF
          cmake --build /tmp/zstd-win/build
          cmake --install /tmp/zstd-win/build
          rm -rf /tmp/zstd-win

      - name: Build LLVM + LLD + libc++ (Windows cross-compile)
        run: |
          git clone --depth 1 --branch llvmorg-${LLVM_VERSION} https://github.com/llvm/llvm-project.git /tmp/llvm
          cmake -S /tmp/llvm/llvm -B /tmp/llvm/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/mingw-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/llvm-install \
            -DLLVM_ENABLE_PROJECTS="lld;libcxx;libcxxabi" \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DLLVM_ENABLE_STATIC_ZSTD=ON \
            -DLLVM_ZSTD_LIBRARY=/tmp/zstd-win-install/lib/libzstd.a \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_LLD=ON \
            -DLLVM_ENABLE_LIBCXX=ON
          cmake --build /tmp/llvm/build
          cmake --install /tmp/llvm/build
          rm -rf /tmp/llvm

      - name: Package
        run: |
          cd /tmp/llvm-install
          tar -czf /tmp/llvm-${{ env.LLVM_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-windows-mingw
          path: /tmp/llvm-*.tar.gz

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: llvm-windows-mingw

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: "LLVM ${{ env.LLVM_VERSION }} (${{ env.TARGET_TRIPLE }}, ${{ env.COMPILER }} ${{ env.COMPILER_VERSION }}, ${{ env.STDLIB }})"
          files: llvm-*.tar.gz
          draft: false
          prerelease: false
