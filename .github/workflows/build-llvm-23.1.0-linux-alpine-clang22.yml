name: Build LLVM 23.1.0 Linux Alpine Clang 22.1.3 (musl)

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      release_tag:
        description: "Release tag for the built artifacts"
        value: ${{ jobs.build.outputs.release_tag }}

permissions:
  contents: write

env:
  LLVM_VERSION: "23.1.0"
  ZSTD_VERSION: v1.5.7
  TARGET_TRIPLE: x86_64-linux-linux
  COMPILER: clang
  COMPILER_VERSION: "22.1.3"
  STDLIB: libcxx
  LLD: lld

jobs:
  build:
    name: Build LLVM 23.1.0 (Linux x86_64 Alpine Clang 22.1.3 musl)
    runs-on: ubuntu-latest
    container: alpine:3.24
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base cmake ninja python3 git wget linux-headers \
            clang22 lld22 libc++-dev libc++ llvm-libunwind-dev

      - name: Compute release tag
        id: meta
        run: |
          TAG="llvm-${{ env.LLVM_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}"
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build zstd
        run: |
          git clone --depth 1 --branch ${ZSTD_VERSION} https://github.com/facebook/zstd.git /tmp/zstd
          cmake -S /tmp/zstd/build/cmake -B /tmp/zstd/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/zstd-install \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DZSTD_BUILD_STATIC=ON \
            -DZSTD_BUILD_SHARED=OFF \
            -DZSTD_BUILD_PROGRAMS=OFF \
            -DZSTD_BUILD_TESTS=OFF
          cmake --build /tmp/zstd/build
          cmake --install /tmp/zstd/build
          rm -rf /tmp/zstd

      - name: Build LLVM + LLD + libc++
        run: |
          git clone --depth 1 --branch llvmorg-${LLVM_VERSION} https://github.com/llvm/llvm-project.git /tmp/llvm
          cmake -S /tmp/llvm/llvm -B /tmp/llvm/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/llvm-install \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DLLVM_ENABLE_PROJECTS="lld" \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DLLVM_ENABLE_STATIC_ZSTD=ON \
            -DLLVM_ZSTD_LIBRARY=/tmp/zstd-install/lib/libzstd.a \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_LLD=ON \
            -DLLVM_ENABLE_LIBCXX=ON \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fuse-ld=lld"
          cmake --build /tmp/llvm/build
          cmake --install /tmp/llvm/build
          rm -rf /tmp/llvm

      - name: Package
        run: |
          cd /tmp/llvm-install
          tar -czf /tmp/llvm-${{ env.LLVM_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.COMPILER }}-${{ env.COMPILER_VERSION }}-${{ env.STDLIB }}-${{ env.LLD }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-linux-alpine
          path: /tmp/llvm-*.tar.gz

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: llvm-linux-alpine

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: "LLVM ${{ env.LLVM_VERSION }} (${{ env.TARGET_TRIPLE }}, ${{ env.COMPILER }} ${{ env.COMPILER_VERSION }}, musl)"
          files: llvm-*.tar.gz
          draft: false
          prerelease: false
